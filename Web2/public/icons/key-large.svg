<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 61 58" fill="none">
  <!-- Large key graphic replicating WinUI Resources/Lkeys -->
  <circle cx="20" cy="22" r="14" stroke="#6C4C2C" stroke-width="3" fill="#F3EAE2"/>
  <circle cx="20" cy="22" r="8"  stroke="#6C4C2C" stroke-width="2" fill="#E7D6C5"/>
  <!-- Key shaft -->
  <rect x="31" y="20" width="26" height="5" rx="2" fill="#6C4C2C"/>
  <!-- Key teeth -->
  <rect x="49" y="25" width="4" height="7" rx="1" fill="#6C4C2C"/>
  <rect x="42" y="25" width="4" height="5" rx="1" fill="#6C4C2C"/>
  <!-- Keyhole inner -->
  <circle cx="20" cy="22" r="4" fill="#6C4C2C" opacity="0.4"/>
</svg>
